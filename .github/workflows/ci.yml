name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest
      - run: python -m alembic upgrade head
        env:
          DATABASE_URL: sqlite:///./migration-test.db

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r requirements.txt
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: python backend/scripts/export_openapi.py backend/openapi.json
      - run: npx openapi-typescript ../backend/openapi.json -o lib/api-schema.ts
        working-directory: frontend
      - run: git diff --exit-code -- backend/openapi.json frontend/lib/api-schema.ts
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
        env:
          EVALFORGE_PYTHON: python

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build and start clean Compose stack
        run: docker compose up --build --detach
      - name: Verify PostgreSQL, Redis queue, worker, API, and frontend
        run: python scripts/compose_smoke.py
      - name: Capture Compose diagnostics
        if: failure()
        run: docker compose ps && docker compose logs --no-color
      - name: Tear down stack and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans
